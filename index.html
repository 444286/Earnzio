<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e1d">
<meta name="description" content="ToolHub — দরকারি অনলাইন টুলস এক জায়গায়।">
<title>ToolHub Dashboard</title>
<style>
:root{--bg:#070c18;--sidebar:#080f20;--panel:#101a2d;--panel2:#131f35;--line:#1d2a43;--text:#eaf0ff;--muted:#8391ad;--blue:#3478f6;--blue2:#1d56c5;--cyan:#61b8ff;--green:#36c995}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans Bengali","Hind Siliguri",sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}.sidebar{width:232px;background:var(--sidebar);border-right:1px solid var(--line);padding:19px 13px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 24px;font-size:20px;font-weight:800;letter-spacing:-.5px}.brand-icon{width:30px;height:30px;display:grid;place-items:center;background:linear-gradient(135deg,#2674ff,#53c5ff);border-radius:9px;color:white}.brand small{display:block;font-size:8px;letter-spacing:1.5px;color:var(--muted);font-weight:600;margin-top:1px}.nav-label{font-size:9px;letter-spacing:1.7px;color:#667590;font-weight:800;padding:15px 10px 8px}.nav-btn{border:0;background:transparent;color:#9aa8c2;width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;text-align:left;margin:2px 0;font-size:12px}.nav-btn .ico{width:16px;text-align:center}.nav-btn:hover,.nav-btn.active{background:#1c5ed8;color:white}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:15px 9px 0;color:#aab6cc;font-size:11px}.side-bottom b{display:block;color:#eaf0ff;font-size:12px}.main{min-width:0;flex:1;padding:26px clamp(16px,3vw,38px) 45px;max-width:1700px;margin:0 auto;width:100%}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:27px}.mobile-brand{display:none;font-weight:800;font-size:18px}.search{width:min(320px,50%);position:relative}.search input{width:100%;background:#111c30;border:1px solid #1e2b43;color:var(--text);padding:11px 14px 11px 37px;border-radius:9px;outline:none}.search:before{content:"⌕";position:absolute;left:13px;top:5px;font-size:22px;color:#7d8ba7}.search input:focus{border-color:#3679f6}.heading{margin-bottom:21px}.eyebrow{color:#5795ff;font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.heading h1{font-size:26px;margin:7px 0 5px;letter-spacing:-.6px}.heading p{margin:0;color:var(--muted);font-size:12px}.section-row{display:flex;align-items:center;justify-content:space-between;margin:25px 0 13px}.section-row h2{font-size:14px;margin:0}.count{color:var(--muted);font-size:11px}
.category-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}.category-row::-webkit-scrollbar{display:none}.cat{white-space:nowrap;background:#101a2c;color:#91a0ba;border:1px solid var(--line);padding:7px 13px;border-radius:7px;font-size:11px}.cat.active,.cat:hover{background:#17366c;border-color:#285fbe;color:#dce9ff}
.tool-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.tool-card{background:linear-gradient(145deg,#111c30,#0e1729);border:1px solid #1b2941;border-radius:11px;min-height:135px;padding:15px;transition:.18s;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start}.tool-card:hover{border-color:#2d67c8;transform:translateY(-2px);background:#14213a}.tool-icon{width:34px;height:34px;border-radius:9px;background:#102a54;color:#69a9ff;display:grid;place-items:center;font-size:17px;margin-bottom:12px}.tool-card h3{font-size:12px;margin:0 0 5px;color:#e8efff}.tool-card p{font-size:10px;line-height:1.5;color:#8391ad;margin:0}.tool-card .arrow{margin-top:auto;padding-top:9px;color:#4c8eff;font-size:10px}
.page-view{display:none}.page-view.active{display:block}.dashboard-view.hidden{display:none}.back{border:1px solid var(--line);background:#101a2c;color:#b8c5dc;padding:8px 12px;border-radius:8px;margin-bottom:20px;font-size:12px}.back:hover{border-color:#3478f6;color:white}.tool-page-head{display:flex;align-items:center;gap:13px;margin-bottom:20px}.tool-page-head .tool-icon{width:45px;height:45px;margin:0;font-size:21px}.tool-page-head h1{font-size:22px;margin:0 0 4px}.tool-page-head p{margin:0;color:var(--muted);font-size:12px}.work-card{max-width:850px;background:#101a2d;border:1px solid var(--line);border-radius:13px;padding:22px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field.full{grid-column:1/-1}label{font-size:11px;color:#aab8d1;font-weight:650}.field input,.field textarea,.field select{width:100%;background:#0a1324;border:1px solid #263550;color:#eaf0ff;border-radius:8px;padding:11px 12px;outline:none;min-width:0}.field textarea{min-height:145px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#4385ff;box-shadow:0 0 0 2px #3478f622}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.btn{border:0;border-radius:8px;padding:10px 15px;background:#2868dc;color:white;font-size:12px;font-weight:700}.btn:hover{background:#347cf7}.btn.alt{background:#1c2a42;color:#c5d1e6;border:1px solid #2b3b58}.btn.alt:hover{background:#263956}.result{margin-top:15px;padding:13px 14px;border:1px solid #263753;border-radius:8px;background:#0a1426;color:#dce8ff;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.7;min-height:0}.result:empty{display:none}.note{font-size:10px;color:#7f8eaa;margin:10px 0 0;line-height:1.6}.download{display:inline-block;margin-top:12px;text-decoration:none}.empty{grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.footer{margin-top:42px;border-top:1px solid var(--line);padding-top:17px;color:#667590;font-size:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:1100px){.tool-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sidebar{width:205px}}
@media(max-width:760px){.sidebar{width:62px;padding:15px 7px}.brand{padding:0 8px 22px}.brand-text,.nav-label,.nav-btn .nav-text,.side-bottom{display:none}.nav-btn{justify-content:center;padding:12px 5px}.nav-btn .ico{font-size:16px}.main{padding:19px 15px 35px}.tool-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tool-card{min-height:135px;padding:13px}.topbar{margin-bottom:22px}.heading h1{font-size:22px}}
@media(max-width:430px){.sidebar{display:none}.main{padding:17px 13px 30px}.mobile-brand{display:block}.topbar{gap:10px}.search{width:min(210px,58%)}.search input{font-size:11px;padding:10px 9px 10px 32px}.search:before{left:10px;top:3px}.heading h1{font-size:21px}.tool-card h3{font-size:11px}.tool-card p{font-size:9px}.work-card{padding:15px}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.tool-page-head h1{font-size:19px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><span class="brand-icon">✦</span><span class="brand-text">ToolHub<small>TOOLS DASHBOARD</small></span></div>
  <div class="nav-label">MAIN</div>
  <button class="nav-btn active" data-nav="dashboard"><span class="ico">▦</span><span class="nav-text">Dashboard</span></button>
  <button class="nav-btn" data-nav="all"><span class="ico">✣</span><span class="nav-text">All Tools</span></button>
  <div class="nav-label">CATEGORIES</div>
  <button class="nav-btn" data-catnav="image"><span class="ico">▧</span><span class="nav-text">Image</span></button>
  <button class="nav-btn" data-catnav="text"><span class="ico">▤</span><span class="nav-text">Text</span></button>
  <button class="nav-btn" data-catnav="developer"><span class="ico">‹›</span><span class="nav-text">Developer</span></button>
  <button class="nav-btn" data-catnav="calculator"><span class="ico">▦</span><span class="nav-text">Calculators</span></button>
  <button class="nav-btn" data-catnav="security"><span class="ico">♙</span><span class="nav-text">Security</span></button>
  <button class="nav-btn" data-catnav="utility"><span class="ico">⌁</span><span class="nav-text">Utility</span></button>
  <div class="side-bottom"><b>ToolHub Workspace</b>Free online tools</div>
</aside>
<main class="main">
  <div class="topbar"><div class="mobile-brand">✦ ToolHub</div><div class="search"><input id="search" placeholder="Search tools..." type="search" aria-label="Search tools"></div></div>
  <section class="dashboard-view" id="dashboard">
    <div class="heading"><div class="eyebrow">WORKSPACE / DASHBOARD</div><h1>ToolHub Dashboard</h1><p>30+ high-quality tools for developers and creators.</p></div>
    <div class="section-row"><h2>✣ &nbsp;All Tools</h2><span class="count" id="toolCount">16 tools available</span></div>
    <div class="category-row" id="categoryFilters">
      <button class="cat active" data-filter="all">All Tools</button><button class="cat" data-filter="image">Image</button><button class="cat" data-filter="text">Text</button><button class="cat" data-filter="developer">Developer</button><button class="cat" data-filter="calculator">Calculators</button><button class="cat" data-filter="security">Security</button><button class="cat" data-filter="utility">Utility</button>
    </div>
    <div class="tool-grid" id="toolGrid"></div>
  </section>
  <section class="page-view" id="toolPage">
    <button class="back" id="backBtn">← &nbsp; Back to Dashboard</button>
    <div class="tool-page-head"><div class="tool-icon" id="pageIcon">▦</div><div><h1 id="pageTitle">Tool</h1><p id="pageDesc"></p></div></div>
    <div class="work-card" id="toolWorkspace"></div>
  </section>
  <div class="footer"><span>© <span id="year"></span> ToolHub. All rights reserved.</span><span>Simple tools. Useful results.</span></div>
</main>
</div>
<script>
const tools=[
{id:'qr',name:'QR Code Generator',desc:'Create customizable QR codes for URLs or text.',icon:'▦',cat:'utility'},
{id:'password',name:'Password Generator',desc:'Generate secure, random passwords with custom rules.',icon:'♙',cat:'security'},
{id:'bmi',name:'BMI Calculator',desc:'Calculate your Body Mass Index and health status.',icon:'∿',cat:'calculator'},
{id:'json',name:'JSON Formatter',desc:'Prettify, minify, and validate your JSON data.',icon:'▧',cat:'developer'},
{id:'unit',name:'Unit Converter',desc:'Convert between different units of measurement.',icon:'↔',cat:'calculator'},
{id:'notes',name:'Online Notepad',desc:'A simple, auto-saving notepad in your browser.',icon:'▤',cat:'text'},
{id:'speech',name:'Text to Speech',desc:'Convert written text into spoken audio.',icon:'♬',cat:'text'},
{id:'base64',name:'Base64 Encoder/Decoder',desc:'Convert text to Base64 format and back.',icon:'#',cat:'developer'},
{id:'age',name:'Age Calculator',desc:'Calculate your exact age in years, months, and days.',icon:'▣',cat:'calculator'},
{id:'discount',name:'Discount Calculator',desc:'Quickly calculate sale prices and total savings.',icon:'％',cat:'calculator'},
{id:'compress',name:'Image Compressor',desc:'Reduce image file size without losing quality.',icon:'▧',cat:'image'},
{id:'resize',name:'Image Resizer',desc:'Resize images to your preferred dimensions.',icon:'▣',cat:'image'},
{id:'word',name:'Word Counter',desc:'Count words, characters, and sentences in text.',icon:'¶',cat:'text'},
{id:'case',name:'Text Case Converter',desc:'Convert text to uppercase, lowercase or title case.',icon:'Aa',cat:'text'},
{id:'percentage',name:'Percentage Calculator',desc:'Calculate percentages quickly and accurately.',icon:'％',cat:'calculator'},
{id:'color',name:'Color Picker',desc:'Pick a color and copy its HEX code.',icon:'◉',cat:'developer'}
];
const $=id=>document.getElementById(id);let activeFilter='all',currentTool=null;
function renderCards(){let q=$('search').value.trim().toLowerCase();let shown=tools.filter(t=>(activeFilter==='all'||t.cat===activeFilter)&&(t.name+' '+t.desc+' '+t.cat).toLowerCase().includes(q));$('toolCount').textContent=shown.length+' tools available';$('toolGrid').innerHTML='';if(!shown.length){$('toolGrid').innerHTML='<div class="empty">No tools found. Try another search.</div>';return;}shown.forEach(t=>{let c=document.createElement('article');c.className='tool-card';c.tabIndex=0;c.setAttribute('role','button');c.innerHTML=`<div class="tool-icon">${t.icon}</div><h3>${t.name}</h3><p>${t.desc}</p><span class="arrow">Open tool&nbsp; →</span>`;c.addEventListener('click',()=>openTool(t.id));c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTool(t.id)}});$('toolGrid').append(c);});}
function setFilter(f){activeFilter=f;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));renderCards();showDashboard();}
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));
document.querySelectorAll('[data-catnav]').forEach(b=>b.onclick=()=>setFilter(b.dataset.catnav));
document.querySelector('[data-nav="dashboard"]').onclick=()=>setFilter('all');document.querySelector('[data-nav="all"]').onclick=()=>setFilter('all');
$('search').addEventListener('input',renderCards);
function showDashboard(){ $('dashboard').classList.remove('hidden');$('toolPage').classList.remove('active');currentTool=null;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.querySelector('[data-nav="dashboard"]').classList.add('active');history.replaceState(null,'',location.pathname+location.search);}
$('backBtn').onclick=showDashboard;
function openTool(id){let t=tools.find(x=>x.id===id);if(!t)return;currentTool=id;$('dashboard').classList.add('hidden');$('toolPage').classList.add('active');$('pageIcon').textContent=t.icon;$('pageTitle').textContent=t.name;$('pageDesc').textContent=t.desc;$('toolWorkspace').innerHTML=toolMarkup(id);wireTool(id);history.replaceState(null,'','#'+id);window.scrollTo({top:0,behavior:'smooth'});}
function field(id,label,placeholder='',type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}"></div>`}
function area(id,label,placeholder=''){return `<div class="field full"><label for="${id}">${label}</label><textarea id="${id}" placeholder="${placeholder}"></textarea></div>`}
function toolMarkup(id){
const wrap=(body,actions='',note='')=>`<div class="field-grid">${body}</div>${actions?`<div class="actions">${actions}</div>`:''}<div class="result" id="result" aria-live="polite"></div>${note?`<p class="note">${note}</p>`:''}`;
const btn=(id,label,alt=false)=>`<button type="button" class="btn ${alt?'alt':''}" id="${id}">${label}</button>`;
switch(id){
case'qr':return wrap(field('qrText','Text or URL','https://example.com'),btn('make','Generate QR Code'), 'QR image generation uses an external QR service. Do not enter confidential information.');
case'password':return wrap(field('length','Password length (6–64)','16','number')+`<div class="field"><label for="symbols">Include symbols</label><select id="symbols"><option value="yes">Yes</option><option value="no">No</option></select></div>`,btn('make','Generate Password')+btn('copy','Copy',true));
case'bmi':return wrap(field('weight','Weight (kg)','65','number')+field('height','Height (cm)','170','number'),btn('make','Calculate BMI'),'BMI is a screening measure, not a medical diagnosis.');
case'json':return wrap(area('data','JSON input','{"name":"ToolHub","active":true}'),btn('format','Format JSON')+btn('minify','Minify')+btn('copy','Copy',true));
case'unit':return wrap(field('value','Value','100','number')+`<div class="field"><label for="from">From</label><select id="from"><option value="m">Meter</option><option value="km">Kilometer</option><option value="cm">Centimeter</option><option value="mm">Millimeter</option><option value="ft">Feet</option><option value="in">Inch</option><option value="mi">Mile</option></select></div><div class="field"><label for="to">To</label><select id="to"><option value="ft">Feet</option><option value="m">Meter</option><option value="km">Kilometer</option><option value="cm">Centimeter</option><option value="mm">Millimeter</option><option value="in">Inch</option><option value="mi">Mile</option></select></div>`,btn('make','Convert'));
case'notes':return wrap(area('data','Your notes','Start typing...'),btn('save','Save note')+btn('clear','Clear',true),'Notes are saved in this browser on this device only.');
case'speech':return wrap(area('data','Text to speak','Type or paste text here...'),btn('speak','Speak')+btn('stop','Stop',true),'Uses your browser’s speech synthesis support.');
case'base64':return wrap(area('data','Text / Base64','Enter text to encode or Base64 to decode...'),btn('encode','Encode')+btn('decode','Decode')+btn('copy','Copy',true));
case'age':return wrap(field('birth','Date of birth','','date'),btn('make','Calculate Age'));
case'discount':return wrap(field('price','Original price','1000','number')+field('discount','Discount (%)','20','number'),btn('make','Calculate Discount'));
case'compress':case'resize':return wrap(`<div class="field full"><label for="file">Choose image</label><input id="file" type="file" accept="image/*"></div>`+(id==='compress'?field('quality','Quality (0.1–1)','0.7','number'):field('width','New width (px)','800','number')+field('height','New height (px)','600','number')),btn('make',id==='compress'?'Compress Image':'Resize Image'),'Image processing happens locally in your browser. Selected image is not uploaded.');
case'word':return wrap(area('data','Your text','Paste or type your text here...'),btn('count','Count words'));
case'case':return wrap(area('data','Your text','Type text here...'),btn('upper','UPPERCASE')+btn('lower','lowercase')+btn('title','Title Case')+btn('copy','Copy',true));
case'percentage':return wrap(field('percent','Percentage (%)','15','number')+field('number','Number','200','number'),btn('make','Calculate'));
case'color':return wrap(`<div class="field"><label for="pick">Choose a color</label><input id="pick" type="color" value="#3478f6" style="height:50px;padding:5px"></div>${field('hex','HEX code','#3478f6')}`,btn('copy','Copy HEX'));
default:return '<p>Tool unavailable.</p>';
}}
function wireTool(id){const root=$('toolWorkspace'),get=x=>root.querySelector('#'+x),result=(s)=>{let r=get('result');if(r)r.textContent=s;},copy=s=>{if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>result('Copied to clipboard.')).catch(()=>result('Copy not available; select and copy the text.'));else result('Clipboard is not supported in this browser.');};
if(id==='qr')get('make').onclick=()=>{let v=get('qrText').value.trim();if(!v){result('Enter text or a URL first.');return;}let img=document.createElement('img');img.alt='Generated QR code';img.width=220;img.height=220;img.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(v);let r=get('result');r.textContent='';r.append(img);};
if(id==='password'){get('make').onclick=()=>{let n=Math.max(6,Math.min(64,Number(get('length').value)||16)),chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'+(get('symbols').value==='yes'?'!@#$%^&*()-_=+[]{}?':'');let a=new Uint32Array(n);crypto.getRandomValues(a);result(Array.from(a,x=>chars[x%chars.length]).join(''));};get('copy').onclick=()=>copy(get('result').textContent);}
if(id==='bmi')get('make').onclick=()=>{let w=+get('weight').value,h=+get('height').value/100;if(!(w>0&&h>0)){result('Enter valid weight and height.');return;}let b=w/(h*h);result(`Your BMI: ${b.toFixed(1)}\n${b<18.5?'Underweight':b<25?'Normal range':b<30?'Overweight':'Obesity range'}`);};
if(id==='json'){let process=min=>{try{let o=JSON.parse(get('data').value),s=JSON.stringify(o,null,min?0:2);get('data').value=s;result('Valid JSON — '+(min?'minified':'formatted')+' successfully.');}catch(e){result('Invalid JSON: '+e.message);}};get('format').onclick=()=>process(false);get('minify').onclick=()=>process(true);get('copy').onclick=()=>copy(get('data').value);}
if(id==='unit')get('make').onclick=()=>{let f={m:1,km:1000,cm:.01,mm:.001,ft:.3048,in:.0254,mi:1609.344},v=Number(get('value').value);if(get('value').value===''||!Number.isFinite(v)){result('Enter a valid number.');return;}result(`${v} ${get('from').value} = ${(v*f[get('from').value]/f[get('to').value]).toLocaleString(undefined,{maximumFractionDigits:8})} ${get('to').value}`);};
if(id==='notes'){get('data').value=localStorage.getItem('toolhub-notes')||'';get('save').onclick=()=>{localStorage.setItem('toolhub-notes',get('data').value);result('Your note has been saved in this browser.');};get('clear').onclick=()=>{get('data').value='';localStorage.removeItem('toolhub-notes');result('Notes cleared.');};}
if(id==='speech'){get('speak').onclick=()=>{if(!('speechSynthesis'in window)){result('Speech synthesis is not supported by this browser.');return;}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(get('data').value));result('Speaking…');};get('stop').onclick=()=>{speechSynthesis.cancel();result('Speech stopped.');};}
if(id==='base64'){get('encode').onclick=()=>{try{result(btoa(unescape(encodeURIComponent(get('data').value))));}catch(e){result('Could not encode this text.');}};get('decode').onclick=()=>{try{result(decodeURIComponent(escape(atob(get('data').value.trim()))));}catch(e){result('Invalid Base64 input.');}};get('copy').onclick=()=>copy(get('result').textContent);}
if(id==='age')get('make').onclick=()=>{let s=get('birth').value;if(!s){result('Choose your date of birth.');return;}let [y,m,d]=s.split('-').map(Number),now=new Date(),ny=now.getFullYear(),nm=now.getMonth()+1,nd=now.getDate();if(new Date(y,m-1,d)>new Date(ny,nm-1,nd)){result('Birth date cannot be in the future.');return;}let yy=ny-y,mm=nm-m,dd=nd-d;if(dd<0){mm--;dd+=new Date(ny,nm-1,0).getDate();}if(mm<0){yy--;mm+=12;}result(`Your age: ${yy} years, ${mm} months and ${dd} days.`);};
if(id==='discount')get('make').onclick=()=>{let p=+get('price').value,d=+get('discount').value;if(get('price').value===''||get('discount').value===''||p<0||d<0||d>100){result('Enter a valid price and discount from 0 to 100%.');return;}result(`Discount amount: ${(p*d/100).toFixed(2)}\nFinal price: ${(p-p*d/100).toFixed(2)}`);};
if(id==='compress'||id==='resize')get('make').onclick=()=>{let f=get('file').files[0];if(!f||!f.type.startsWith('image/')){result('Choose a valid image file first.');return;}let url=URL.createObjectURL(f),img=new Image();img.onload=()=>{let c=document.createElement('canvas'),w=img.naturalWidth,h=img.naturalHeight;if(id==='resize'){w=+get('width').value;h=+get('height').value;if(!(w>0&&h>0)||w>10000||h>10000){result('Enter width and height between 1 and 10000 px.');URL.revokeObjectURL(url);return;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let type=id==='compress'?'image/jpeg':'image/png',q=id==='compress'?Math.max(.1,Math.min(1,+get('quality').value||.7)):1;c.toBlob(blob=>{URL.revokeObjectURL(url);if(!blob){result('Image processing failed.');return;}let link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=id==='compress'?'toolhub-compressed.jpg':'toolhub-resized.png';link.className='btn download';link.textContent='Download image';get('result').textContent=`Original: ${img.naturalWidth} × ${img.naturalHeight}px, ${(f.size/1024).toFixed(1)} KB\nNew: ${w} × ${h}px, ${(blob.size/1024).toFixed(1)} KB\n`;get('result').append(link);},type,q);};img.onerror=()=>{URL.revokeObjectURL(url);result('Could not read this image.');};img.src=url;};
if(id==='word')get('count').onclick=()=>{let t=get('data').value;result(`Words: ${t.trim()?t.trim().split(/\s+/u).length:0}\nCharacters: ${t.length}\nCharacters (without spaces): ${t.replace(/\s/g,'').length}\nSentences: ${(t.match(/[.!?।]+/g)||[]).length}`);};
if(id==='case'){['upper','lower','title'].forEach(mode=>get(mode).onclick=()=>{let t=get('data').value;let out=mode==='upper'?t.toUpperCase():mode==='lower'?t.toLowerCase():t.toLowerCase().replace(/\b\p{L}/gu,x=>x.toUpperCase());result(out);});get('copy').onclick=()=>copy(get('result').textContent);}
if(id==='percentage')get('make').onclick=()=>{let p=+get('percent').value,n=+get('number').value;if(get('percent').value===''||get('number').value===''){result('Fill in both values.');return;}result(`${p}% of ${n} = ${(p*n/100).toLocaleString(undefined,{maximumFractionDigits:8})}`);};
if(id==='color'){get('pick').oninput=()=>get('hex').value=get('pick').value;get('copy').onclick=()=>copy(get('hex').value);}
}
$('year').textContent=new Date().getFullYear();renderCards();if(location.hash&&tools.some(t=>'#'+t.id===location.hash))openTool(location.hash.slice(1));
</script>
</body></html>
